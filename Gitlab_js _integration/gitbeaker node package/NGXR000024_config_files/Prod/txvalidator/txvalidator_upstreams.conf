upstream txvalidator_pcf {
  server product-validator-transaction.p8.pcf.dell.com:443 max_fails=0 slow_start=60s;
  server product-validator-transaction.s8.pcf.dell.com:443 max_fails=0 slow_start=60s;
  zone txvalidator_pcf_zone 64k;
  keepalive 15;
}

upstream txvalidator_pcf_fallback {
    server product-validator-transaction.g8p.pcf.dell.com:443;
    zone txvalidator_pcf_fallback_zone 64k;
    keepalive 15;
}
